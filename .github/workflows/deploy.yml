name: Deploy

# main 브랜치에 push하면 빌드·검증하고 서버에 올린다. (수동 실행도 가능)
#  - 화면(dist)은 정적 파일이라 nginx가 내보낸다.
#  - 게임 서버(server/와 규칙 코드)는 하나의 JS 파일로 묶어서 올리고, 서버에서 `project-y` 서비스(systemd)로 돈다. 올린 뒤 서비스를 다시 시작한다.
# 서버를 처음 준비하는 방법은 README.md의 "배포"를 본다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹쳐서 서로 덮어쓰지 않게 한 번에 하나만 돌린다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc 타입체크를 포함하므로, 타입 오류가 있는 코드는 여기서 멈추고 배포되지 않는다.
      - name: Build
        run: npm run build

      - name: Validate scenarios
        run: npm run validate

      # 시나리오 엔진·과제 빌더·B7·자판기의 의도한 풀이 시험
      - name: Scenario tests
        run: npm run scenario

      # 화면 렌더링 스모크 (브라우저 없이)
      - name: UI smoke test
        run: npm run uitest

      # 실제 WebSocket으로 방 만들기부터 엔딩까지 돌려 본다 (몇 초)
      - name: Server integration test
        run: npm run nettest

      # 게임 서버: ws까지 한 파일(dist-server/main.mjs)로 묶는다. 서버에 Node(20 이상)만 있으면 되고 npm install이 필요 없다.
      - name: Bundle server
        run: npm run build:server

      # 화면: dist 안의 파일들만 올린다 (폴더째가 아니라)
      - name: Upload web
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*'
          target: /tmp/project-y-web
          strip_components: 1
          # 이전 배포가 중간에 실패해서 남은 파일이 섞이지 않게 올리기 전에 비운다.
          rm: true

      - name: Upload server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist-server/main.mjs'
          target: /tmp/project-y-app
          strip_components: 1
          rm: true

      - name: Swap into place and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=/home/deploy/apps/project-y
            mkdir -p "$APP"

            # 화면
            rm -rf "$APP/web"
            mv /tmp/project-y-web "$APP/web"
            # nginx(다른 사용자)가 읽을 수 있게 권한을 맞춘다. 이 줄이 없으면 배포 직후 403이 날 수 있다.
            chmod -R a+rX "$APP/web"

            # 서버: 이전 파일은 app-old로 남기고 새 파일로 바꾼다
            rm -rf "$APP/app-old"
            if [ -d "$APP/app" ]; then mv "$APP/app" "$APP/app-old"; fi
            mv /tmp/project-y-app "$APP/app"

            # 서비스를 다시 시작한다 (서버 계정에 이 명령만 비밀번호 없이 허용해 둔다 — README 참고)
            sudo systemctl restart project-y
            sleep 2
            systemctl is-active --quiet project-y
